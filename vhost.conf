# RDU Dashboard — Apache Virtual Host Configuration
# คัดลอกไปใส่ใน: C:\xampp\apache\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    ServerName rdu-dashboard.test
    DocumentRoot "C:/xampp/htdocs/RDU/public"

    <Directory "C:/xampp/htdocs/RDU/public">
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog "C:/xampp/apache/logs/rdu-error.log"
    CustomLog "C:/xampp/apache/logs/rdu-access.log" combined
</VirtualHost>

# หมายเหตุ: เพิ่ม hosts file ด้วย
# C:\Windows\System32\drivers\etc\hosts
# 127.0.0.1   rdu-dashboard.test
